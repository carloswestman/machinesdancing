[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

# Binaries are copied into guest images and onto the host: keep them small.
[profile.release]
lto = true
codegen-units = 1
strip = true

[workspace.dependencies]
jete = { path = "crates/jete" }
jete-agent = { path = "crates/jete-agent" }
jete-protocol = { path = "crates/jete-protocol" }
rustix = { version = "1.1.6", features = ["fs", "process", "pty", "termios"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-vsock = "0.7.2"
