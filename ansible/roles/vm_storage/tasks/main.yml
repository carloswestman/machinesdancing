- name: Install storage tools
  ansible.builtin.apt:
    name:
      - lvm2
      - xfsprogs
    state: present

- name: Create the VM storage logical volume
  community.general.lvol:
    vg: "{{ vm_storage_vg }}"
    lv: "{{ vm_storage_lv }}"
    size: "{{ vm_storage_size }}"
    shrink: false
    resizefs: true
  register: vm_storage_lvol

# A dry run only reports the volume as created, so there is nothing to
# format, mount or inspect yet.
- name: Note whether this dry run can see the volume
  ansible.builtin.set_fact:
    vm_storage_pending: "{{ ansible_check_mode and vm_storage_lvol is changed }}"

- name: Format it as XFS with reflinks
  community.general.filesystem:
    dev: "/dev/{{ vm_storage_vg }}/{{ vm_storage_lv }}"
    fstype: xfs
    opts: -m reflink=1
  when: not vm_storage_pending

- name: Mount it
  ansible.posix.mount:
    path: "{{ vm_storage_mount }}"
    src: "/dev/{{ vm_storage_vg }}/{{ vm_storage_lv }}"
    fstype: xfs
    opts: defaults,noatime
    state: mounted
  when: not vm_storage_pending

# Instant per-VM disks depend on this, so fail loudly if it is ever missing.
- name: Read filesystem features
  ansible.builtin.command: xfs_info {{ vm_storage_mount }}
  register: vm_storage_xfs_info
  changed_when: false
  check_mode: false
  when: not vm_storage_pending

- name: Require reflink support
  ansible.builtin.assert:
    that: "'reflink=1' in vm_storage_xfs_info.stdout"
    fail_msg: "{{ vm_storage_mount }} does not support reflinks; per-VM disks would be full copies."
    quiet: true
  when: not vm_storage_pending
