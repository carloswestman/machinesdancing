# Installs barre, the egress gateway, from a build on the Mac, and runs it as
# a service. Not part of site.yml, so configuring a host never depends on a
# local build; see barre.yml.
- name: Check that barre is built
  ansible.builtin.stat:
    path: "{{ barre_binary }}"
  delegate_to: localhost
  become: false
  register: barre_build

- name: Require a barre build
  ansible.builtin.fail:
    msg: "No barre build at {{ barre_binary }}. Run scripts/install-barre, which builds it first."
  when: not barre_build.stat.exists

- name: Create the barre user
  ansible.builtin.user:
    name: barre
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Install barre
  ansible.builtin.copy:
    src: "{{ barre_binary }}"
    dest: /usr/local/bin/barre
    owner: root
    group: root
    mode: "0755"
  notify: Restart barre

# Starts a VM behind barre and removes it, until the control plane does.
- name: Install barre-vm
  ansible.builtin.template:
    src: barre-vm.j2
    dest: /usr/local/bin/barre-vm
    owner: root
    group: root
    mode: "0755"

# Policies are written by root (barre allow/revoke) and only read by the
# service. /run is cleared at boot, like the VMs.
- name: Create the policy directory at boot
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/barre.conf
    content: |
      d /run/barre 0755 root root -
      d /run/barre/policies 0750 root barre -
      d /run/barre/credentials 0750 root barre -
    owner: root
    group: root
    mode: "0644"
  register: barre_tmpfiles

- name: Create the policy directory now
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/barre.conf
  when: barre_tmpfiles.changed
  changed_when: true

# The certificate authority for names whose rule gives a credential
# (docs/design/barre.md, G2): made once, its key readable by root and barre
# only. The guest image trusts ca.crt; making a new one means rebuilding it.
- name: Create barre's configuration directory
  ansible.builtin.file:
    path: /etc/barre
    state: directory
    owner: root
    group: barre
    mode: "0750"

- name: Make barre's certificate authority
  ansible.builtin.command: /usr/local/bin/barre ca init
  args:
    creates: /etc/barre/ca.key
  notify: Restart barre

- name: Install the barre service
  ansible.builtin.template:
    src: barre.service.j2
    dest: /etc/systemd/system/barre.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart barre

- name: Run barre
  ansible.builtin.systemd_service:
    name: barre
    enabled: true
    state: started
    daemon_reload: true
