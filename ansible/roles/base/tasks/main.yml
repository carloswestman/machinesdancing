- name: Set hostname from inventory
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ base_timezone }}"

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Keep chrony running
  ansible.builtin.systemd_service:
    name: chrony
    state: started
    enabled: true

- name: Enable daily package list updates and unattended upgrades
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

# Loads after Ubuntu's 50unattended-upgrades, so these values win. Origins
# stay at Ubuntu's default: security updates only.
- name: Configure unattended upgrades
  ansible.builtin.template:
    src: 52unattended-upgrades-local.j2
    dest: /etc/apt/apt.conf.d/52unattended-upgrades-local
    owner: root
    group: root
    mode: "0644"

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap journal size on disk
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/00-size.conf
    content: |
      # Managed by Ansible (machinesdancing/ansible/roles/base). Do not edit on the host.
      [Journal]
      SystemMaxUse={{ base_journal_max_use }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
