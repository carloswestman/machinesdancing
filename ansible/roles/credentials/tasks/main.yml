# Where the host keeps the credentials agents use but never hold
# (docs/design/instances.md#credentials). The values are put here by the
# human, from outside the repos (scripts/install-github-app); this role only
# makes the place and the tools that read it.
- name: Create the machinesdancing configuration directory
  ansible.builtin.file:
    path: /etc/machinesdancing
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the credentials directory, root only
  ansible.builtin.file:
    path: /etc/machinesdancing/credentials
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install github-token
  ansible.builtin.copy:
    src: github-token
    dest: /usr/local/sbin/github-token
    owner: root
    group: root
    mode: "0755"
