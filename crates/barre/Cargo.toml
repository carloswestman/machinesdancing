[package]
name = "barre"
description = "Egress gateway for jete's VMs: allows each connection by the name it was made for."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
clap.workspace = true
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustix = { workspace = true, features = ["net"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3.55", default-features = false, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "signal"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.12"

[dev-dependencies]
jete.workspace = true
jete-protocol.workspace = true
